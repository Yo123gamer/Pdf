<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Sanskrit Book</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #fdf2f8); color: #1f2937;
    }
    .card {
      width: min(100%, 420px); background: #fff; border-radius: 22px;
      padding: 32px 24px; text-align: center; box-shadow: 0 16px 45px #1f29371a;
    }
    .icon {
      width: 76px; height: 76px; margin: 0 auto 18px; display: grid; place-items: center;
      border-radius: 20px; background: #eef2ff; font-size: 38px;
    }
    h1 { margin: 0 0 10px; font-size: 1.55rem; }
    p { margin: 0 0 22px; line-height: 1.55; color: #6b7280; }
    .button {
      display: inline-block; width: 100%; padding: 15px 20px; border-radius: 12px;
      background: #4f46e5; color: white; text-decoration: none; font-weight: 700;
      transition: background .2s, transform .2s;
    }
    .button:hover { background: #4338ca; transform: translateY(-1px); }
    .note { margin-top: 16px; font-size: .85rem; color: #9ca3af; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">📘</div>
    <h1>Sanskrit Book — Class 9</h1>
    <p>Tap the button below to download the PDF to your device.</p>
    <a class="button" href="Sanskrit-Book-Class9.pdf" download="Sanskrit-Book-Class9.pdf">
      ⬇ Download PDF
    </a>
    <div class="note">PDF document · Class 9 Sanskrit</div>
  </main>
</body>
</html>
